<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanban Board</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'JetBrains Mono', 'Courier New', monospace; background: #020617; color: #e2e8f0; min-height: 100vh; }

  /* ── Grid background ── */
  body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(30,41,59,0.3) 1px, transparent 1px), linear-gradient(90deg, rgba(30,41,59,0.3) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; z-index: 0; }

  .header { background: rgba(15,23,42,0.95); border-bottom: 1px solid #1e293b; padding: 0.75rem 1.5rem; display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 1; }
  .header h1 { font-size: 1rem; color: #22d3ee; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; text-shadow: 0 0 10px #22d3ee, 0 0 20px rgba(34,211,238,0.5), 0 0 40px rgba(34,211,238,0.2); }
  .header h1::before { content: '> '; color: #34d399; }
  .header .btn { padding: 0.4rem 1rem; background: transparent; color: #22d3ee; border: 1px solid #22d3ee; border-radius: 4px; cursor: pointer; font-size: 0.75rem; font-weight: 600; font-family: inherit; text-transform: uppercase; letter-spacing: 0.05em; transition: all 0.15s; }
  .header .btn:hover { background: rgba(34,211,238,0.1); box-shadow: 0 0 12px rgba(34,211,238,0.3); }
  .header .btn-danger { color: #fb7185; border-color: #fb7185; }
  .header .btn-danger:hover { background: rgba(251,113,133,0.1); box-shadow: 0 0 12px rgba(251,113,133,0.3); }
  .header .btn-success { color: #34d399; border-color: #34d399; }
  .header .btn-success:hover { background: rgba(52,211,153,0.1); box-shadow: 0 0 12px rgba(52,211,153,0.3); }

  .board { display: flex; gap: 0.75rem; padding: 1rem; overflow-x: auto; height: calc(100vh - 52px); align-items: flex-start; position: relative; z-index: 1; }

  .column { background: rgba(15,23,42,0.8); border: 1px solid #1e293b; border-radius: 4px; min-width: 220px; max-width: 280px; flex: 1; display: flex; flex-direction: column; max-height: 100%; }
  .column-header { padding: 0.6rem 0.75rem; font-size: 0.65rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: #64748b; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; }
  .column-header .count { background: #0f172a; border: 1px solid #1e293b; padding: 0.1rem 0.4rem; border-radius: 2px; font-size: 0.6rem; color: #94a3b8; }
  .column-body { padding: 0.5rem; overflow-y: auto; flex: 1; min-height: 60px; }
  .column-body.drag-over { background: rgba(34,211,238,0.03); border: 1px dashed rgba(34,211,238,0.3); }

  .task-card { background: #0f172a; border: 1px solid #1e293b; border-left: 3px solid #334155; border-radius: 3px; padding: 0.5rem 0.6rem; margin-bottom: 0.4rem; cursor: grab; transition: all 0.15s; }
  .task-card:hover { border-color: #22d3ee; border-left-color: #22d3ee; box-shadow: 0 0 12px rgba(34,211,238,0.4), inset 0 0 12px rgba(34,211,238,0.05); }
  .task-card.dragging { opacity: 0.4; cursor: grabbing; }
  .task-card .title { font-size: 0.8rem; font-weight: 500; margin-bottom: 0.3rem; color: #e2e8f0; }
  .task-card .meta { font-size: 0.6rem; color: #475569; display: flex; justify-content: space-between; }
  .task-card .assignee { background: rgba(34,211,238,0.1); color: #22d3ee; padding: 0.05rem 0.35rem; border-radius: 2px; border: 1px solid rgba(34,211,238,0.2); }

  /* ── Status colors for column headers ── */
  .column[data-status="triage"] .column-header { border-left: 3px solid #94a3b8; padding-left: 0.55rem; }
  .column[data-status="todo"] .column-header { border-left: 3px solid #64748b; padding-left: 0.55rem; }
  .column[data-status="ready"] .column-header { border-left: 3px solid #22d3ee; padding-left: 0.55rem; box-shadow: -3px 0 8px rgba(34,211,238,0.3); }
  .column[data-status="running"] .column-header { border-left: 3px solid #fbbf24; padding-left: 0.55rem; box-shadow: -3px 0 8px rgba(251,191,36,0.3); }
  .column[data-status="blocked"] .column-header { border-left: 3px solid #fb7185; padding-left: 0.55rem; box-shadow: -3px 0 8px rgba(251,113,133,0.3); }
  .column[data-status="done"] .column-header { border-left: 3px solid #34d399; padding-left: 0.55rem; box-shadow: -3px 0 8px rgba(52,211,153,0.3); }

  /* ── Drawer ── */
  .drawer-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; }
  .drawer-overlay.active { display: block; }
  .drawer { position: fixed; top: 0; right: 0; width: 440px; height: 100vh; background: rgba(15,23,42,0.98); border-left: 1px solid #1e293b; z-index: 101; transform: translateX(100%); transition: transform 0.2s ease; display: flex; flex-direction: column; }
  .drawer.active { transform: translateX(0); }
  .drawer-header { padding: 0.75rem 1rem; border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; }
  .drawer-header h2 { font-size: 0.85rem; color: #22d3ee; font-weight: 600; }
  .drawer-header h2::before { content: '$ '; color: #34d399; }
  .drawer-header .close-btn { background: none; border: 1px solid #334155; color: #64748b; font-size: 0.8rem; cursor: pointer; padding: 0.2rem 0.5rem; border-radius: 3px; font-family: inherit; }
  .drawer-header .close-btn:hover { border-color: #fb7185; color: #fb7185; }
  .drawer-body { flex: 1; overflow-y: auto; padding: 1rem; }
  .drawer-field { margin-bottom: 0.75rem; }
  .drawer-field label { display: block; font-size: 0.6rem; color: #475569; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.25rem; }
  .drawer-field label::before { content: '── '; color: #1e293b; }
  .drawer-field input, .drawer-field textarea, .drawer-field select { width: 100%; padding: 0.5rem; background: #020617; border: 1px solid #1e293b; border-radius: 3px; color: #e2e8f0; font-size: 0.8rem; font-family: inherit; }
  .drawer-field textarea { min-height: 80px; resize: vertical; }
  .drawer-field input:focus, .drawer-field textarea:focus, .drawer-field select:focus { outline: none; border-color: #22d3ee; box-shadow: 0 0 8px rgba(34,211,238,0.15); }
  .drawer-actions { padding: 0.75rem 1rem; border-top: 1px solid #1e293b; display: flex; gap: 0.5rem; }
  .drawer-actions .btn { flex: 1; padding: 0.5rem; border: 1px solid; border-radius: 3px; cursor: pointer; font-size: 0.7rem; font-weight: 600; font-family: inherit; text-transform: uppercase; letter-spacing: 0.05em; background: transparent; transition: all 0.15s; }
  .drawer-actions .btn-primary { color: #22d3ee; border-color: #22d3ee; }
  .drawer-actions .btn-primary:hover { background: rgba(34,211,238,0.1); box-shadow: 0 0 8px rgba(34,211,238,0.2); }
  .drawer-actions .btn-success { color: #34d399; border-color: #34d399; }
  .drawer-actions .btn-success:hover { background: rgba(52,211,153,0.1); box-shadow: 0 0 8px rgba(52,211,153,0.2); }
  .drawer-actions .btn-danger { color: #fb7185; border-color: #fb7185; }
  .drawer-actions .btn-danger:hover { background: rgba(251,113,133,0.1); box-shadow: 0 0 8px rgba(251,113,133,0.2); }
  .drawer-actions .btn-secondary { color: #64748b; border-color: #334155; }
  .drawer-actions .btn-secondary:hover { background: rgba(51,65,85,0.3); }

  /* ── Comments ── */
  .comment { background: #020617; border: 1px solid #1e293b; border-radius: 3px; padding: 0.5rem; margin-bottom: 0.4rem; }
  .comment .author { font-size: 0.6rem; color: #22d3ee; font-weight: 600; margin-bottom: 0.2rem; }
  .comment .author::before { content: '@'; }
  .comment .time { color: #334155; }
  .comment .body { font-size: 0.75rem; color: #94a3b8; margin-top: 0.2rem; }

  /* ── Modal ── */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; align-items: center; justify-content: center; }
  .modal-overlay.active { display: flex; }
  .modal { background: rgba(15,23,42,0.98); border: 1px solid #1e293b; border-radius: 6px; padding: 1.5rem; width: 460px; max-width: 90vw; }
  .modal h3 { font-size: 0.9rem; color: #22d3ee; font-weight: 700; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.1em; }
  .modal h3::before { content: '>>> '; color: #34d399; }
  .modal .form-group { margin-bottom: 0.75rem; }
  .modal .form-group label { display: block; font-size: 0.6rem; color: #475569; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.25rem; }
  .modal .form-group input, .modal .form-group textarea, .modal .form-group select { width: 100%; padding: 0.5rem; background: #020617; border: 1px solid #1e293b; border-radius: 3px; color: #e2e8f0; font-size: 0.8rem; font-family: inherit; }
  .modal .form-group textarea { min-height: 80px; resize: vertical; }
  .modal .form-group input:focus, .modal .form-group textarea:focus, .modal .form-group select:focus { outline: none; border-color: #22d3ee; box-shadow: 0 0 8px rgba(34,211,238,0.15); }
  .modal .form-actions { display: flex; gap: 0.5rem; margin-top: 1rem; }
  .modal .form-actions .btn { flex: 1; padding: 0.5rem; border: 1px solid; border-radius: 3px; cursor: pointer; font-size: 0.7rem; font-weight: 600; font-family: inherit; text-transform: uppercase; letter-spacing: 0.05em; background: transparent; }

  /* ── Toast ── */
  .toast { position: fixed; bottom: 1rem; right: 1rem; padding: 0.6rem 1.2rem; border-radius: 4px; font-size: 0.75rem; z-index: 300; transition: opacity 0.3s; font-family: inherit; border: 1px solid; }
  .toast.success { background: rgba(6,78,59,0.9); color: #34d399; border-color: #34d399; }
  .toast.error { background: rgba(127,29,29,0.9); color: #fca5a5; border-color: #fb7185; }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #020617; }
  ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #334155; }
</style>
</head>
<body>
<div class="header">
  <h1>Kanban Board</h1>
  <div style="display:flex;gap:0.5rem;align-items:center;">
    <span style="font-size:0.6rem;color:#334155;" id="task-count">0 tasks</span>
    <button class="btn" onclick="showCreateForm()">+ New Task</button>
  </div>
</div>
<div class="board" id="board"><div style="color:#334155;padding:2rem;font-size:0.8rem;">Loading...</div></div>

<!-- Drawer -->
<div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <h2 id="drawer-title">Task</h2>
    <button class="close-btn" onclick="closeDrawer()">✕</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
  <div class="drawer-actions">
    <button class="btn btn-primary" onclick="saveTask()">Save</button>
    <button class="btn btn-success" onclick="completeTask()">✓ Complete</button>
    <button class="btn btn-danger" onclick="deleteTask()">Delete</button>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h3>New Task</h3>
    <div class="form-group">
      <label>Title</label>
      <input type="text" id="new-title" placeholder="What needs to be done?" />
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="new-body" placeholder="Add details..."></textarea>
    </div>
    <div class="form-group">
      <label>Assignee</label>
      <select id="new-assignee"></select>
    </div>
    <div class="form-group">
      <label>Status</label>
      <select id="new-status"></select>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" onclick="submitTask()">Create</button>
      <button class="btn btn-secondary" onclick="hideCreateForm()">Cancel</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast" style="display:none;"></div>

<script>
var STATUSES = [
  { key: 'triage', label: 'Triage' },
  { key: 'todo', label: 'Todo' },
  { key: 'ready', label: 'Ready' },
  { key: 'running', label: 'Running' },
  { key: 'blocked', label: 'Blocked' },
  { key: 'done', label: 'Done' },
];
var tasks = [];
var profiles = [];
var draggedCard = null;
var currentTaskId = null;

function loadTasks() {
  fetch('/api/boards/default/tasks').then(function(r){return r.json();}).then(function(data){
    tasks = data;
    document.getElementById('task-count').textContent = tasks.length + ' tasks';
    renderBoard();
  });
}

function loadProfiles() {
  fetch('/api/profiles').then(function(r){return r.json();}).then(function(data){ profiles = data; });
}

function renderBoard() {
  var board = document.getElementById('board');
  var html = '';
  for(var i=0;i<STATUSES.length;i++){
    var status = STATUSES[i];
    var statusTasks = tasks.filter(function(t){return t.status===status.key;});
    html += '<div class="column" data-status="'+status.key+'">';
    html += '<div class="column-header"><span>'+status.label+'</span><span class="count">'+statusTasks.length+'</span></div>';
    html += '<div class="column-body" data-status="'+status.key+'">';
    for(var j=0;j<statusTasks.length;j++){ html += renderCard(statusTasks[j]); }
    html += '</div></div>';
  }
  board.innerHTML = html;
}

function renderCard(task) {
  return '<div class="task-card" draggable="true" data-id="'+esc(task.id)+'" onclick="openTask(\''+esc(task.id)+'\')">'+
    '<div class="title">'+esc(task.title)+'</div>'+
    '<div class="meta"><span class="assignee">'+esc(task.assignee||'unassigned')+'</span><span>'+fmtDate(task.created_at)+'</span></div>'+
    '</div>';
}

function esc(s) { var d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
function fmtDate(s) { if(!s) return ''; var d=new Date(s*1000); return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }

/* ── Drag and Drop ── */
document.addEventListener('dragstart', function(e) {
  if(e.target.classList.contains('task-card')) { draggedCard=e.target; e.target.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; }
});
document.addEventListener('dragend', function(e) {
  if(e.target.classList.contains('task-card')) { e.target.classList.remove('dragging'); draggedCard=null; }
});
document.addEventListener('dragover', function(e) {
  var cb=e.target.closest('.column-body');
  if(cb) { e.preventDefault(); e.dataTransfer.dropEffect='move'; cb.style.borderColor='rgba(34,211,238,0.3)'; cb.style.background='rgba(34,211,238,0.03)'; }
});
document.addEventListener('dragleave', function(e) {
  var cb=e.target.closest('.column-body');
  if(cb && !cb.contains(e.relatedTarget)) { cb.style.borderColor=''; cb.style.background=''; }
});
document.addEventListener('drop', function(e) {
  e.preventDefault();
  var cb=e.target.closest('.column-body');
  if(!cb||!draggedCard) return;
  cb.style.borderColor=''; cb.style.background='';
  var newStatus=cb.dataset.status;
  var taskId=draggedCard.dataset.id;
  fetch('/api/tasks/'+taskId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:newStatus})})
    .then(function(){ var t=tasks.find(function(x){return x.id===taskId;}); if(t) t.status=newStatus; renderBoard(); });
});

/* ── Drawer ── */
function openTask(id) {
  currentTaskId = id;
  var task = tasks.find(function(t){return t.id===id;});
  if(!task) return;
  document.getElementById('drawer-title').textContent = task.title;
  var commentsHtml = '';
  if(task.comments && task.comments.length > 0) {
    for(var i=0;i<task.comments.length;i++){
      var c = task.comments[i];
      commentsHtml += '<div class="comment"><div class="author">'+esc(c.author||'unknown')+' <span class="time">'+fmtDate(c.created_at)+'</span></div><div class="body">'+esc(c.body)+'</div></div>';
    }
  } else {
    commentsHtml = '<div style="color:#334155;font-size:0.7rem;">No comments yet</div>';
  }
  var assigneeOptions = '';
  for(var i=0;i<profiles.length;i++){
    assigneeOptions += '<option value="'+esc(profiles[i].name)+'" '+(task.assignee===profiles[i].name?'selected':'')+'>'+esc(profiles[i].name)+'</option>';
  }
  var statusOptions = '';
  for(var i=0;i<STATUSES.length;i++){
    statusOptions += '<option value="'+STATUSES[i].key+'" '+(task.status===STATUSES[i].key?'selected':'')+'>'+STATUSES[i].label+'</option>';
  }
  document.getElementById('drawer-body').innerHTML =
    '<div class="drawer-field"><label>Title</label><input type="text" id="field-title" value="'+esc(task.title)+'"/></div>'+
    '<div class="drawer-field"><label>Description</label><textarea id="field-body">'+esc(task.body||'')+'</textarea></div>'+
    '<div class="drawer-field"><label>Assignee</label><select id="field-assignee">'+assigneeOptions+'</select></div>'+
    '<div class="drawer-field"><label>Status</label><select id="field-status">'+statusOptions+'</select></div>'+
    '<div class="drawer-field"><label>Comments</label>'+commentsHtml+
    '<div style="display:flex;gap:0.5rem;margin-top:0.5rem;">'+
    '<input type="text" id="new-comment" placeholder="Add a comment..." style="flex:1;padding:0.4rem;background:#020617;border:1px solid #1e293b;border-radius:3px;color:#e2e8f0;font-size:0.75rem;font-family:inherit;"/>'+
    '<button class="btn btn-primary" onclick="addComment()" style="padding:0.4rem 0.75rem;">Post</button></div></div>';
  document.getElementById('drawer').classList.add('active');
  document.getElementById('drawer-overlay').classList.add('active');
}

function closeDrawer() {
  document.getElementById('drawer').classList.remove('active');
  document.getElementById('drawer-overlay').classList.remove('active');
  currentTaskId = null;
}

function saveTask() {
  if(!currentTaskId) return;
  fetch('/api/tasks/'+currentTaskId,{
    method:'PUT',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      title:document.getElementById('field-title').value,
      body:document.getElementById('field-body').value,
      assignee:document.getElementById('field-assignee').value,
      status:document.getElementById('field-status').value,
    })
  }).then(function(r){return r.json();}).then(function(){
    showToast('Task saved','success');
    closeDrawer();
    loadTasks();
  });
}

function completeTask() {
  if(!currentTaskId) return;
  fetch('/api/tasks/'+currentTaskId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'done'})})
    .then(function(){ showToast('Task completed','success'); closeDrawer(); loadTasks(); });
}

function deleteTask() {
  if(!currentTaskId) return;
  if(!confirm('Delete this task?')) return;
  fetch('/api/tasks/'+currentTaskId,{method:'DELETE'})
    .then(function(){ showToast('Task deleted','success'); closeDrawer(); loadTasks(); });
}

function addComment() {
  if(!currentTaskId) return;
  var input = document.getElementById('new-comment');
  var body = input.value.trim();
  if(!body) return;
  fetch('/api/tasks/'+currentTaskId+'/comments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({body:body,author:'human'})})
    .then(function(){ input.value=''; openTask(currentTaskId); });
}

/* ── Modal ── */
function showCreateForm() {
  document.getElementById('modal-overlay').classList.add('active');
  var sel = document.getElementById('new-assignee');
  sel.innerHTML = '';
  for(var i=0;i<profiles.length;i++){
    sel.innerHTML += '<option value="'+esc(profiles[i].name)+'" '+(profiles[i].name==='default'?'selected':'')+'>'+esc(profiles[i].name)+'</option>';
  }
  var ssel = document.getElementById('new-status');
  ssel.innerHTML = '';
  for(var i=0;i<STATUSES.length;i++){
    ssel.innerHTML += '<option value="'+STATUSES[i].key+'" '+(STATUSES[i].key==='todo'?'selected':'')+'>'+STATUSES[i].label+'</option>';
  }
  document.getElementById('new-title').focus();
}

function hideCreateForm() {
  document.getElementById('modal-overlay').classList.remove('active');
  document.getElementById('new-title').value = '';
  document.getElementById('new-body').value = '';
}

function submitTask() {
  var title = document.getElementById('new-title').value.trim();
  if(!title) return;
  fetch('/api/boards/default/tasks',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      title:title,
      body:document.getElementById('new-body').value,
      assignee:document.getElementById('new-assignee').value,
      status:document.getElementById('new-status').value,
    })
  }).then(function(){ showToast('Task created','success'); hideCreateForm(); loadTasks(); });
}

document.getElementById('modal-overlay').addEventListener('click',function(e){
  if(e.target===e.currentTarget) hideCreateForm();
});

/* ── Toast ── */
function showToast(msg,type) {
  var t=document.getElementById('toast');
  t.textContent=msg; t.className='toast '+type; t.style.display='block'; t.style.opacity='1';
  setTimeout(function(){t.style.opacity='0';setTimeout(function(){t.style.display='none';},300);},2500);
}

/* ── Keyboard ── */
document.addEventListener('keydown',function(e){
  if(e.target.matches('input,textarea,select')) return;
  if(e.key==='n'||e.key==='N'){e.preventDefault();showCreateForm();}
  if(e.key==='Escape'){closeDrawer();hideCreateForm();document.getElementById('modal-overlay').classList.remove('active');}
});

/* ── Init ── */
loadProfiles();
loadTasks();
setInterval(loadTasks,10000);
</script>
</body>
</html>
