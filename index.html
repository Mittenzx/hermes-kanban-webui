<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanban Board</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #0a0a0a;
    --bg-secondary: #111111;
    --bg-tertiary: #1a1a1a;
    --bg-card: #141414;
    --border: #2a2a2a;
    --border-light: #333333;
    --text-primary: #e0e0e0;
    --text-secondary: #888888;
    --text-muted: #555555;
    --accent-cyan: #00d4ff;
    --accent-green: #00ff88;
    --accent-pink: #ff006e;
    --accent-yellow: #ffbe0b;
    --accent-purple: #8338ec;
    --accent-orange: #fb5607;
    --glow-cyan: 0 0 8px rgba(0,212,255,0.4), 0 0 16px rgba(0,212,255,0.15);
    --glow-green: 0 0 8px rgba(0,255,136,0.4), 0 0 16px rgba(0,255,136,0.15);
    --glow-pink: 0 0 8px rgba(255,0,110,0.4), 0 0 16px rgba(255,0,110,0.15);
    --glow-yellow: 0 0 8px rgba(255,190,11,0.4), 0 0 16px rgba(255,190,11,0.15);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'JetBrains Mono', 'Courier New', monospace; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; }

  /* ── Scanline overlay ── */
  body::before { content: ''; position: fixed; inset: 0; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px); pointer-events: none; z-index: 0; }

  /* ── Header ── */
  .header { background: var(--bg-secondary); border-bottom: 1px solid var(--border); padding: 0.75rem 1.5rem; display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 1; }
  .header h1 { font-size: 0.9rem; color: var(--accent-cyan); font-weight: 700; text-transform: uppercase; letter-spacing: 0.15em; text-shadow: var(--glow-cyan); }
  .header h1::before { content: '▸ '; color: var(--accent-green); text-shadow: var(--glow-green); }
  .header .btn { padding: 0.35rem 0.8rem; background: transparent; color: var(--accent-cyan); border: 1px solid var(--accent-cyan); border-radius: 2px; cursor: pointer; font-size: 0.7rem; font-weight: 600; font-family: inherit; text-transform: uppercase; letter-spacing: 0.05em; transition: all 0.15s; }
  .header .btn:hover { background: rgba(0,212,255,0.08); box-shadow: var(--glow-cyan); }
  .header .btn-success { color: var(--accent-green); border-color: var(--accent-green); }
  .header .btn-success:hover { background: rgba(0,255,136,0.08); box-shadow: var(--glow-green); }
  .header .btn-danger { color: var(--accent-pink); border-color: var(--accent-pink); }
  .header .btn-danger:hover { background: rgba(255,0,110,0.08); box-shadow: var(--glow-pink); }

  /* ── Board ── */
  .board { display: flex; gap: 0.6rem; padding: 1rem; overflow-x: auto; height: calc(100vh - 52px); align-items: flex-start; position: relative; z-index: 1; }

  .column { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 3px; min-width: 220px; max-width: 280px; flex: 1; display: flex; flex-direction: column; max-height: 100%; }
  .column-header { padding: 0.5rem 0.65rem; font-size: 0.6rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-secondary); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .column-header .count { background: var(--bg-tertiary); border: 1px solid var(--border); padding: 0.05rem 0.35rem; border-radius: 2px; font-size: 0.55rem; color: var(--text-muted); }
  .column-body { padding: 0.4rem; overflow-y: auto; flex: 1; min-height: 60px; }
  .column-body.drag-over { background: rgba(0,212,255,0.02); border: 1px dashed rgba(0,212,255,0.2); }

  /* ── Task Cards ── */
  .task-card { background: var(--bg-card); border: 1px solid var(--border); border-left: 3px solid var(--border-light); border-radius: 2px; padding: 0.45rem 0.55rem; margin-bottom: 0.35rem; cursor: grab; transition: all 0.15s; }
  .task-card:hover { border-color: var(--accent-cyan); border-left-color: var(--accent-cyan); box-shadow: var(--glow-cyan); }
  .task-card.dragging { opacity: 0.3; cursor: grabbing; }
  .task-card .title { font-size: 0.75rem; font-weight: 500; margin-bottom: 0.25rem; color: var(--text-primary); }
  .task-card .meta { font-size: 0.55rem; color: var(--text-muted); display: flex; justify-content: space-between; }
  .task-card .assignee { background: rgba(0,212,255,0.08); color: var(--accent-cyan); padding 0.05rem 0.3rem; border-radius: 2px; border: 1px solid rgba(0,212,255,0.15); }

  /* ── Column status colors ── */
  .column[data-status="triage"] .column-header { border-left: 3px solid var(--text-secondary); padding-left: 0.5rem; }
  .column[data-status="todo"] .column-header { border-left: 3px solid var(--text-muted); padding-left: 0.5rem; }
  .column[data-status="ready"] .column-header { border-left: 3px solid var(--accent-cyan); padding-left: 0.5rem; box-shadow: -3px 0 6px rgba(0,212,255,0.2); }
  .column[data-status="running"] .column-header { border-left: 3px solid var(--accent-yellow); padding-left: 0.5rem; box-shadow: -3px 0 6px rgba(255,190,11,0.2); }
  .column[data-status="blocked"] .column-header { border-left: 3px solid var(--accent-pink); padding-left: 0.5rem; box-shadow: -3px 0 6px rgba(255,0,110,0.2); }
  .column[data-status="done"] .column-header { border-left: 3px solid var(--accent-green); padding-left: 0.5rem; box-shadow: -3px 0 6px rgba(0,255,136,0.2); }

  /* ── Drawer ── */
  .drawer-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; backdrop-filter: blur(2px); }
  .drawer-overlay.active { display: block; }
  .drawer { position: fixed; top: 0; right: 0; width: 440px; height: 100vh; background: var(--bg-secondary); border-left: 1px solid var(--border); z-index: 101; transform: translateX(100%); transition: transform 0.2s ease; display: flex; flex-direction: column; }
  .drawer.active { transform: translateX(0); }
  .drawer-header { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .drawer-header h2 { font-size: 0.8rem; color: var(--accent-cyan); font-weight: 600; text-shadow: var(--glow-cyan); }
  .drawer-header h2::before { content: '$ '; color: var(--accent-green); text-shadow: var(--glow-green); }
  .drawer-header .close-btn { background: none; border: 1px solid var(--border); color: var(--text-muted); font-size: 0.75rem; cursor: pointer; padding: 0.15rem 0.45rem; border-radius: 2px; font-family: inherit; }
  .drawer-header .close-btn:hover { border-color: var(--accent-pink); color: var(--accent-pink); }
  .drawer-body { flex: 1; overflow-y: auto; padding: 1rem; }
  .drawer-field { margin-bottom: 0.75rem; }
  .drawer-field label { display: block; font-size: 0.55rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 0.2rem; }
  .drawer-field label::before { content: '── '; color: var(--border); }
  .drawer-field input, .drawer-field textarea, .drawer-field select { width: 100%; padding: 0.45rem; background: var(--bg-primary); border: 1px solid var(--border); border-radius: 2px; color: var(--text-primary); font-size: 0.75rem; font-family: inherit; }
  .drawer-field textarea { min-height: 80px; resize: vertical; }
  .drawer-field input:focus, .drawer-field textarea:focus, .drawer-field select:focus { outline: none; border-color: var(--accent-cyan); box-shadow: 0 0 6px rgba(0,212,255,0.2); }
  .drawer-actions { padding: 0.75rem 1rem; border-top: 1px solid var(--border); display: flex; gap: 0.4rem; }
  .drawer-actions .btn { flex: 1; padding: 0.45rem; border: 1px solid; border-radius: 2px; cursor: pointer; font-size: 0.65rem; font-weight: 600; font-family: inherit; text-transform: uppercase; letter-spacing: 0.05em; background: transparent; transition: all 0.15s; }
  .drawer-actions .btn-primary { color: var(--accent-cyan); border-color: var(--accent-cyan); }
  .drawer-actions .btn-primary:hover { background: rgba(0,212,255,0.08); box-shadow: var(--glow-cyan); }
  .drawer-actions .btn-success { color: var(--accent-green); border-color: var(--accent-green); }
  .drawer-actions .btn-success:hover { background: rgba(0,255,136,0.08); box-shadow: var(--glow-green); }
  .drawer-actions .btn-danger { color: var(--accent-pink); border-color: var(--accent-pink); }
  .drawer-actions .btn-danger:hover { background: rgba(255,0,110,0.08); box-shadow: var(--glow-pink); }
  .drawer-actions .btn-secondary { color: var(--text-muted); border-color: var(--border); }
  .drawer-actions .btn-secondary:hover { background: var(--bg-tertiary); }

  /* ── Comments ── */
  .comment { background: var(--bg-primary); border: 1px solid var(--border); border-radius: 2px; padding: 0.4rem; margin-bottom: 0.35rem; }
  .comment .author { font-size: 0.55rem; color: var(--accent-cyan); font-weight: 600; margin-bottom: 0.15rem; }
  .comment .author::before { content: '@'; }
  .comment .time { color: var(--text-muted); }
  .comment .body { font-size: 0.7rem; color: var(--text-secondary); margin-top: 0.15rem; }

  /* ── Modal ── */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 200; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
  .modal-overlay.active { display: flex; }
  .modal { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 4px; padding: 1.25rem; width: 460px; max-width: 90vw; }
  .modal h3 { font-size: 0.8rem; color: var(--accent-cyan); font-weight: 700; margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; text-shadow: var(--glow-cyan); }
  .modal h3::before { content: '>>> '; color: var(--accent-green); text-shadow: var(--glow-green); }
  .modal .form-group { margin-bottom: 0.6rem; }
  .modal .form-group label { display: block; font-size: 0.55rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 0.2rem; }
  .modal .form-group input, .modal .form-group textarea, .modal .form-group select { width: 100%; padding: 0.45rem; background: var(--bg-primary); border: 1px solid var(--border); border-radius: 2px; color: var(--text-primary); font-size: 0.75rem; font-family: inherit; }
  .modal .form-group textarea { min-height: 70px; resize: vertical; }
  .modal .form-group input:focus, .modal .form-group textarea:focus, .modal .form-group select:focus { outline: none; border-color: var(--accent-cyan); box-shadow: 0 0 6px rgba(0,212,255,0.2); }
  .modal .form-actions { display: flex; gap: 0.4rem; margin-top: 0.75rem; }
  .modal .form-actions .btn { flex: 1; padding: 0.45rem; border: 1px solid; border-radius: 2px; cursor: pointer; font-size: 0.65rem; font-weight: 600; font-family: inherit; text-transform: uppercase; letter-spacing: 0.05em; background: transparent; }

  /* ── Toast ── */
  .toast { position: fixed; bottom: 1rem; right: 1rem; padding: 0.5rem 1rem; border-radius: 3px; font-size: 0.7rem; z-index: 300; transition: opacity 0.3s; font-family: inherit; border: 1px solid; }
  .toast.success { background: rgba(0,40,20,0.9); color: var(--accent-green); border-color: var(--accent-green); box-shadow: var(--glow-green); }
  .toast.error { background: rgba(40,0,20,0.9); color: var(--accent-pink); border-color: var(--accent-pink); box-shadow: var(--glow-pink); }

/* ── Nav Bar ── */
  .nav { background: var(--bg-secondary); border-bottom: 1px solid var(--border); padding: 0 1.5rem; display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 1; height: 44px; }
  .nav-brand { font-size: 0.85rem; color: var(--accent-cyan); font-weight: 700; text-transform: uppercase; letter-spacing: 0.15em; text-shadow: var(--glow-cyan); }
  .nav-brand::before { content: '▸ '; color: var(--accent-green); text-shadow: var(--glow-green); }
  .nav-menu { display: flex; gap: 0; height: 100%; }
  .nav-item { padding: 0 1rem; font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; cursor: pointer; display: flex; align-items: center; border-bottom: 2px solid transparent; transition: all 0.15s; height: 100%; }
  .nav-item:hover { color: var(--text-primary); }
  .nav-item.active { color: var(--accent-cyan); border-bottom-color: var(--accent-cyan); text-shadow: var(--glow-cyan); }
  .nav-actions { display: flex; gap: 0.4rem; align-items: center; }

  /* ── Page container ── */
  .page { display: none; height: calc(100vh - 44px); }
  .page.active { display: block; }
  ::-webkit-scrollbar-track { background: var(--bg-primary); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-light); }
</style>
</head>
<body>
<div class="nav">
  <div class="nav-brand">Hermes</div>
  <div class="nav-menu">
    <div class="nav-item active" data-page="kanban" onclick="switchPage('kanban')">Kanban</div>
    <div class="nav-item" data-page="profiles" onclick="switchPage('profiles')">Profiles</div>
  </div>
  <div class="nav-actions">
    <span style="font-size:0.55rem;color:var(--text-muted);" id="task-count">0 tasks</span>
  </div>
</div>

<div class="page active" id="page-kanban">
<div class="header">
  <div style="display:flex;gap:0.6rem;align-items:center;">
    <h1>Kanban</h1>
    <select id="board-switcher" onchange="switchBoard(this.value)" style="background:var(--bg-primary);border:1px solid var(--border);border-radius:2px;color:var(--text-secondary);padding:0.25rem 0.4rem;font-size:0.65rem;font-family:inherit;"></select>
    <button class="btn" onclick="showCreateBoard()" style="padding:0.25rem 0.5rem;font-size:0.6rem;">+ Board</button>
  </div>
  <div style="display:flex;gap:0.4rem;align-items:center;">
    <button class="btn" onclick="showCreateForm()">+ New Task</button>
  </div>
</div>
<div class="board" id="board"><div style="color:var(--text-muted);padding:2rem;font-size:0.75rem;">Loading...</div></div>

<!-- Drawer -->
<div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <h2 id="drawer-title">Task</h2>
    <button class="close-btn" onclick="closeDrawer()">✕</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
  <div class="drawer-actions">
    <button class="btn btn-primary" onclick="saveTask()">Save</button>
    <button class="btn btn-success" onclick="completeTask()">✓ Complete</button>
    <button class="btn btn-danger" onclick="deleteTask()">Delete</button>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h3>New Task</h3>
    <div class="form-group">
      <label>Title</label>
      <input type="text" id="new-title" placeholder="What needs to be done?" />
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="new-body" placeholder="Add details..."></textarea>
    </div>
    <div class="form-group">
      <label>Assignee</label>
      <select id="new-assignee"></select>
    </div>
    <div class="form-group">
      <label>Status</label>
      <select id="new-status"></select>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" onclick="submitTask()">Create</button>
      <button class="btn btn-secondary" onclick="hideCreateForm()">Cancel</button>
    </div>
  </div>
</div><!-- end modal -->

</div><!-- end page-kanban -->

<!-- Toast -->
<div id="toast" class="toast" style="display:none;"></div>

<script>
var STATUSES = [
  { key: 'triage', label: 'Triage' },
  { key: 'todo', label: 'Todo' },
  { key: 'ready', label: 'Ready' },
  { key: 'running', label: 'Running' },
  { key: 'blocked', label: 'Blocked' },
  { key: 'done', label: 'Done' },
];
var tasks = [];
var profiles = [];
var draggedCard = null;
var currentTaskId = null;
var currentBoard = 'default';
var boards = [];
var selectedIdentity = '';
var currentFileProfile = '';
var currentFilePath = '';

function esc(s) { var d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
function fmtDate(s) { if(!s) return ''; var d=new Date(s*1000); return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }

function loadTasks() {
  fetch('/api/boards/'+currentBoard+'/tasks').then(function(r){return r.json();}).then(function(data){
    tasks = data;
    document.getElementById('task-count').textContent = tasks.length + ' tasks';
    renderBoard();
  });
}

function loadProfiles() {
  fetch('/api/profiles').then(function(r){return r.json();}).then(function(data){ profiles = data; });
}

function loadBoards() {
  fetch('/api/boards').then(function(r){return r.json();}).then(function(data){
    boards = data;
    var sel = document.getElementById('board-switcher');
    sel.innerHTML = '';
    for(var i=0;i<boards.length;i++){
      sel.innerHTML += '<option value="'+esc(boards[i].slug)+'" '+(boards[i].slug===currentBoard?'selected':'')+'>'+esc(boards[i].name)+'</option>';
    }
  });
}

function switchBoard(slug) { currentBoard = slug; loadTasks(); }

function showCreateBoard() {
  var slug = prompt('Board slug (lowercase, hyphens ok):');
  if(!slug) return;
  slug = slug.trim().toLowerCase();
  fetch('/api/boards',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slug:slug})})
    .then(function(r){return r.json();}).then(function(data){
      if(data.error) { alert(data.error); return; }
      loadBoards();
      switchBoard(slug);
    });
}

function renderBoard() {
  var board = document.getElementById('board');
  var html = '';
  for(var i=0;i<STATUSES.length;i++){
    var status = STATUSES[i];
    var statusTasks = tasks.filter(function(t){return t.status===status.key;});
    html += '<div class="column" data-status="'+status.key+'">';
    html += '<div class="column-header"><span>'+status.label+'</span><span class="count">'+statusTasks.length+'</span></div>';
    html += '<div class="column-body" data-status="'+status.key+'">';
    for(var j=0;j<statusTasks.length;j++){ html += renderCard(statusTasks[j]); }
    html += '</div></div>';
  }
  board.innerHTML = html;
}

function renderCard(task) {
  return '<div class="task-card" draggable="true" data-id="'+esc(task.id)+'" onclick="openTask(\''+esc(task.id)+'\')">'+
    '<div class="title">'+esc(task.title)+'</div>'+
    '<div class="meta"><span class="assignee">'+esc(task.assignee||'unassigned')+'</span><span>'+fmtDate(task.created_at)+'</span></div>'+
    '</div>';
}

/* ── Drag and Drop ── */
document.addEventListener('dragstart', function(e) {
  if(e.target.classList.contains('task-card')) { draggedCard=e.target; e.target.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; }
});
document.addEventListener('dragend', function(e) {
  if(e.target.classList.contains('task-card')) { e.target.classList.remove('dragging'); draggedCard=null; }
});
document.addEventListener('dragover', function(e) {
  var cb=e.target.closest('.column-body');
  if(cb) { e.preventDefault(); e.dataTransfer.dropEffect='move'; cb.style.borderColor='rgba(0,212,255,0.2)'; cb.style.background='rgba(0,212,255,0.02)'; }
});
document.addEventListener('dragleave', function(e) {
  var cb=e.target.closest('.column-body');
  if(cb && !cb.contains(e.relatedTarget)) { cb.style.borderColor=''; cb.style.background=''; }
});
document.addEventListener('drop', function(e) {
  e.preventDefault();
  var cb=e.target.closest('.column-body');
  if(!cb||!draggedCard) return;
  cb.style.borderColor=''; cb.style.background='';
  var newStatus=cb.dataset.status;
  var taskId=draggedCard.dataset.id;
  fetch('/api/tasks/'+taskId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:newStatus})})
    .then(function(){ var t=tasks.find(function(x){return x.id===taskId;}); if(t) t.status=newStatus; renderBoard(); });
});

/* ── Drawer ── */
function openTask(id) {
  currentTaskId = id;
  var task = tasks.find(function(t){return t.id===id;});
  if(!task) return;
  document.getElementById('drawer-title').textContent = task.title;
  var commentsHtml = '';
  if(task.comments && task.comments.length > 0) {
    for(var i=0;i<task.comments.length;i++){
      var c = task.comments[i];
      commentsHtml += '<div class="comment"><div class="author">'+esc(c.author||'unknown')+' <span class="time">'+fmtDate(c.created_at)+'</span></div><div class="body">'+esc(c.body)+'</div></div>';
    }
  } else {
    commentsHtml = '<div style="color:var(--text-muted);font-size:0.65rem;">No comments yet</div>';
  }
  var assigneeOptions = '';
  for(var i=0;i<profiles.length;i++){
    assigneeOptions += '<option value="'+esc(profiles[i].name)+'" '+(task.assignee===profiles[i].name?'selected':'')+'>'+esc(profiles[i].name)+'</option>';
  }
  var statusOptions = '';
  for(var i=0;i<STATUSES.length;i++){
    statusOptions += '<option value="'+STATUSES[i].key+'" '+(task.status===STATUSES[i].key?'selected':'')+'>'+STATUSES[i].label+'</option>';
  }
  document.getElementById('drawer-body').innerHTML =
    '<div class="drawer-field"><label>Title</label><input type="text" id="field-title" value="'+esc(task.title)+'"/></div>'+
    '<div class="drawer-field"><label>Description</label><textarea id="field-body">'+esc(task.body||'')+'</textarea></div>'+
    '<div class="drawer-field"><label>Assignee</label><select id="field-assignee">'+assigneeOptions+'</select></div>'+
    '<div class="drawer-field"><label>Status</label><select id="field-status">'+statusOptions+'</select></div>'+
    '<div class="drawer-field"><label>Comments</label>'+commentsHtml+
    '<div style="display:flex;gap:0.4rem;margin-top:0.4rem;">'+
    '<input type="text" id="new-comment" placeholder="Add a comment..." style="flex:1;padding:0.35rem;background:var(--bg-primary);border:1px solid var(--border);border-radius:2px;color:var(--text-primary);font-size:0.7rem;font-family:inherit;"/>'+
    '<button class="btn btn-primary" onclick="addComment()" style="padding:0.35rem 0.6rem;">Post</button></div></div>';
  document.getElementById('drawer').classList.add('active');
  document.getElementById('drawer-overlay').classList.add('active');
}

function closeDrawer() {
  document.getElementById('drawer').classList.remove('active');
  document.getElementById('drawer-overlay').classList.remove('active');
  currentTaskId = null;
}

function saveTask() {
  if(!currentTaskId) return;
  fetch('/api/tasks/'+currentTaskId,{
    method:'PUT',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      title:document.getElementById('field-title').value,
      body:document.getElementById('field-body').value,
      assignee:document.getElementById('field-assignee').value,
      status:document.getElementById('field-status').value,
    })
  }).then(function(r){return r.json();}).then(function(){
    showToast('Task saved','success');
    closeDrawer();
    loadTasks();
  });
}

function completeTask() {
  if(!currentTaskId) return;
  fetch('/api/tasks/'+currentTaskId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'done'})})
    .then(function(){ showToast('Task completed','success'); closeDrawer(); loadTasks(); });
}

function deleteTask() {
  if(!currentTaskId) return;
  if(!confirm('Delete this task?')) return;
  fetch('/api/tasks/'+currentTaskId,{method:'DELETE'})
    .then(function(){ showToast('Task deleted','success'); closeDrawer(); loadTasks(); });
}

function addComment() {
  if(!currentTaskId) return;
  var input = document.getElementById('new-comment');
  var body = input.value.trim();
  if(!body) return;
  fetch('/api/tasks/'+currentTaskId+'/comments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({body:body,author:'human'})})
    .then(function(){ input.value=''; openTask(currentTaskId); });
}

/* ── Modal ── */
function showCreateForm() {
  document.getElementById('modal-overlay').classList.add('active');
  var sel = document.getElementById('new-assignee');
  sel.innerHTML = '';
  for(var i=0;i<profiles.length;i++){
    sel.innerHTML += '<option value="'+esc(profiles[i].name)+'" '+(profiles[i].name==='default'?'selected':'')+'>'+esc(profiles[i].name)+'</option>';
  }
  var ssel = document.getElementById('new-status');
  ssel.innerHTML = '';
  for(var i=0;i<STATUSES.length;i++){
    ssel.innerHTML += '<option value="'+STATUSES[i].key+'" '+(STATUSES[i].key==='todo'?'selected':'')+'>'+STATUSES[i].label+'</option>';
  }
  document.getElementById('new-title').focus();
}

function hideCreateForm() {
  document.getElementById('modal-overlay').classList.remove('active');
  document.getElementById('new-title').value = '';
  document.getElementById('new-body').value = '';
}

function submitTask() {
  var title = document.getElementById('new-title').value.trim();
  if(!title) return;
  fetch('/api/boards/'+currentBoard+'/tasks',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      title:title,
      body:document.getElementById('new-body').value,
      assignee:document.getElementById('new-assignee').value,
      status:document.getElementById('new-status').value,
    })
  }).then(function(){ showToast('Task created','success'); hideCreateForm(); loadTasks(); });
}

// Close modals on overlay click
document.getElementById('modal-overlay').addEventListener('click',function(e){
  if(e.target===e.currentTarget) hideCreateForm();
});
document.getElementById('create-profile-overlay').addEventListener('click', function(e) {
  if(e.target === e.currentTarget) hideCreateProfile();
});

/* ── Toast ── */
function showToast(msg,type) {
  var t=document.getElementById('toast');
  t.textContent=msg; t.className='toast '+type; t.style.display='block'; t.style.opacity='1';
  setTimeout(function(){t.style.opacity='0';setTimeout(function(){t.style.display='none';},300);},2500);
}

/* ── Keyboard ── */
document.addEventListener('keydown',function(e){
  if(e.target.matches('input,textarea,select')) return;
  if(e.key==='n'||e.key==='N'){e.preventDefault();showCreateForm();}
  if(e.key==='Escape'){closeDrawer();hideCreateForm();hideCreateProfile();}
});

/* ── Navigation ── */
function switchPage(page) {
  var items = document.querySelectorAll('.nav-item');
  for(var i=0;i<items.length;i++){
    items[i].classList.toggle('active', items[i].dataset.page===page);
  }
  var pages = document.querySelectorAll('.page');
  for(var i=0;i<pages.length;i++){
    pages[i].classList.toggle('active', pages[i].id==='page-'+page);
  }
  if(page==='profiles') renderProfiles();
}

/* ── Profiles ── */
function loadProfiles() {
  fetch('/api/profiles').then(function(r){return r.json();}).then(function(data){ profiles = data; }).catch(function(){ profiles = []; });
}

function renderProfiles() {
  var container = document.getElementById('profiles-list');
  if(!container) return;
  container.innerHTML = '';
  var searchEl = document.getElementById('profile-search');
  var query = searchEl ? searchEl.value.toLowerCase().trim() : '';
  var filtered = profiles;
  if(query) {
    filtered = profiles.filter(function(p){
      return p.name.toLowerCase().indexOf(query) !== -1 ||
        (p.personality && p.personality.toLowerCase().indexOf(query) !== -1);
    });
  }
  var countEl = document.getElementById('profile-count');
  if(countEl) countEl.textContent = filtered.length + ' / ' + profiles.length;
  if(filtered.length === 0) {
    container.innerHTML = '<div style="color:var(--text-muted);font-size:0.7rem;padding:2rem;text-align:center;">' + (query ? 'No profiles match "' + esc(query) + '"' : 'No profiles found. <button class="btn btn-success" onclick="showCreateProfile()" style="margin-top:0.5rem;">+ Create your first profile</button>') + '</div>';
    return;
  }
  for(var i=0;i<filtered.length;i++){
    var p = filtered[i];
    var dot = p.is_default ? '◆' : '○';
    var dotColor = p.is_default ? 'var(--accent-green)' : 'var(--text-muted)';
    var personalityPreview = p.personality ? p.personality.replace(/[#*_\[\]()`~>]/g,'').substring(0,80) : 'No personality set';
    var skillsText = p.skills_count ? p.skills_count + ' skills' : '0 skills';
    var modelText = p.model ? p.model.split('/').pop() : '';
    container.innerHTML +=
      '<div style="background:var(--bg-card);border:1px solid var(--border);border-left:3px solid ' + dotColor + ';border-radius:3px;padding:0.75rem 1rem;display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;transition:all 0.15s;" onmouseover="this.style.boxShadow=\'var(--glow-cyan)\';this.style.borderColor=\'var(--accent-cyan)\'" onmouseout="this.style.boxShadow=\'none\';this.style.borderColor=\'var(--border)\'">'+
        '<div style="flex:1;min-width:0;">'+
          '<div style="display:flex;align-items:center;gap:0.4rem;margin-bottom:0.2rem;">'+
            '<span style="color:' + dotColor + ';font-size:0.7rem;">' + dot + '</span>'+
            '<span style="font-size:0.8rem;color:var(--text-primary);font-weight:600;">' + esc(p.name.toUpperCase()) + '</span>'+
            (p.is_default ? '<span style="font-size:0.5rem;color:var(--accent-green);background:rgba(0,255,136,0.08);border:1px solid rgba(0,255,136,0.2);padding:0.05rem 0.3rem;border-radius:2px;">DEFAULT</span>' : '')+
          '</div>'+
          '<div style="font-size:0.55rem;color:var(--text-muted);margin-bottom:0.3rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc(p.path) + '</div>'+
          '<div style="display:flex;gap:0.5rem;flex-wrap:wrap;">'+
            '<span style="font-size:0.55rem;color:var(--accent-cyan);background:rgba(0,212,255,0.06);border:1px solid rgba(0,212,255,0.15);padding:0.05rem 0.3rem;border-radius:2px;">◇ ' + esc(personalityPreview) + '</span>'+
            '<span style="font-size:0.55rem;color:var(--text-muted);background:var(--bg-tertiary);border:1px solid var(--border);padding:0.05rem 0.3rem;border-radius:2px;">⬡ ' + esc(skillsText) + '</span>'+
            (modelText ? '<span style="font-size:0.55rem;color:var(--text-muted);background:var(--bg-tertiary);border:1px solid var(--border);padding:0.05rem 0.3rem;border-radius:2px;">⬢ ' + esc(modelText) + '</span>' : '')+
          '</div>'+
        '</div>'+
        '<div style="display:flex;gap:0.3rem;flex-shrink:0;">'+
          '<button class="btn" style="padding:0.25rem 0.5rem;font-size:0.55rem;" onclick="showFiles(\'' + esc(p.name) + '\')">Files</button>'+
          '<button class="btn" style="padding:0.25rem 0.5rem;font-size:0.55rem;" onclick="editSoul(\'' + esc(p.name) + '\')">SOUL.md</button>'+
          (p.is_default ? '' : '<button class="btn btn-danger" style="padding:0.25rem 0.5rem;font-size:0.55rem;" onclick="deleteProfile(\'' + esc(p.name) + '\')">Delete</button>')+
        '</div>'+
      '</div>';
  }
}

function deleteProfile(name) {
  if(!confirm('Delete profile "' + name + '"?\n\nThis cannot be undone.')) return;
  fetch('/api/profiles/' + name, {method: 'DELETE'})
    .then(function(r){return r.json();}).then(function(data){
      if(data.error) { showToast(data.error, 'error'); return; }
      showToast('Profile "' + name + '" deleted', 'success');
      loadProfiles();
      renderProfiles();
    }).catch(function(){ showToast('Failed to delete profile', 'error'); });
}

/* ── File Browser ── */

function showFiles(name) {
  currentFileProfile = name;
  var container = document.getElementById('profiles-list');
  container.innerHTML = '';
  // Header with back button
  container.innerHTML += '<div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.75rem;">'+
    '<button class="btn" style="padding:0.25rem 0.5rem;font-size:0.6rem;" onclick="renderProfiles()">← Back</button>'+
    '<span style="font-size:0.7rem;color:var(--accent-cyan);font-weight:600;">📁 ' + esc(name) + '/</span>'+
    '</div>';
  // Loading
  container.innerHTML += '<div style="color:var(--text-muted);font-size:0.65rem;padding:1rem;">Loading...</div>';
  fetch('/api/profiles/' + name + '/files')
    .then(function(r){return r.json();}).then(function(files){
      container.innerHTML = '';
      // Header
      container.innerHTML += '<div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.75rem;">'+
        '<button class="btn" style="padding:0.25rem 0.5rem;font-size:0.6rem;" onclick="renderProfiles()">← Back</button>'+
        '<span style="font-size:0.7rem;color:var(--accent-cyan);font-weight:600;">📁 ' + esc(name) + '/</span>'+
        '<span style="font-size:0.55rem;color:var(--text-muted);">(' + files.length + ' items)</span>'+
        '</div>';
      if(files.length === 0) {
        container.innerHTML += '<div style="color:var(--text-muted);font-size:0.65rem;padding:1rem;text-align:center;">Empty directory</div>';
        return;
      }
      for(var i=0;i<files.length;i++){
        var f = files[i];
        var icon = f.is_dir ? '📁' : '📄';
        var sizeText = f.is_dir ? '' : formatSize(f.size);
        var actions = '';
        if(!f.is_dir) {
          if(f.path === 'SOUL.md') {
            actions = '<button class="btn" style="padding:0.15rem 0.4rem;font-size:0.5rem;" onclick="editSoul(\''+esc(name)+'\',\''+esc(f.path)+'\')">Edit</button>';
          } else {
            actions = '<button class="btn" style="padding:0.15rem 0.4rem;font-size:0.5rem;" onclick="viewFile(\''+esc(f.path)+'\')">View</button>';
          }
          actions += '<button class="btn" style="padding:0.15rem 0.4rem;font-size:0.5rem;" onclick="editSoul(\''+esc(name)+'\',\''+esc(f.path)+'\')">Edit</button>';
        }
        container.innerHTML += '<div style="display:flex;align-items:center;gap:0.4rem;padding:0.35rem 0.5rem;border-bottom:1px solid var(--border);font-size:0.65rem;">'+
          '<span style="flex-shrink:0;">'+icon+'</span>'+
          '<span style="flex:1;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(f.path)+'</span>'+
          '<span style="color:var(--text-muted);flex-shrink:0;font-size:0.55rem;">'+sizeText+'</span>'+
          '<div style="flex-shrink:0;display:flex;gap:0.2rem;">'+actions+'</div>'+
          '</div>';
      }
    });
}

function formatSize(bytes) {
  if(bytes < 1024) return bytes + ' B';
  if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/(1024*1024)).toFixed(1) + ' MB';
}

/* ── SOUL.md Editor ── */
function editSoul(name, filePath) {
  currentFileProfile = name;
  currentFilePath = filePath || 'SOUL.md';
  var container = document.getElementById('profiles-list');
  container.innerHTML = '<div style="color:var(--text-muted);font-size:0.65rem;padding:1rem;">Loading...</div>';
  fetch('/api/profiles/' + name + '/file?path=' + encodeURIComponent(currentFilePath))
    .then(function(r){return r.json();}).then(function(data){
      if(data.error) { container.innerHTML = '<div style="color:var(--accent-pink);font-size:0.65rem;padding:1rem;">Error: ' + esc(data.error) + '</div>'; return; }
      var fileName = currentFilePath.split('/').pop();
      container.innerHTML =
        '<div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.75rem;">'+
          '<button class="btn" style="padding:0.25rem 0.5rem;font-size:0.6rem;" onclick="showFiles(\''+esc(name)+'\')">← Back</button>'+
          '<span style="font-size:0.7rem;color:var(--accent-cyan);font-weight:600;">✏️ Editing ' + esc(fileName) + '</span>'+
          '<span style="font-size:0.55rem;color:var(--text-muted);">('+esc(name)+')</span>'+
        '</div>'+
        '<textarea id="soul-editor" style="width:100%;height:calc(100vh - 200px);min-height:300px;background:var(--bg-primary);border:1px solid var(--border);border-radius:3px;color:var(--text-primary);font-size:0.7rem;font-family:inherit;padding:0.75rem;resize:vertical;outline:none;" onfocus="this.style.borderColor=\'var(--accent-cyan)\';this.style.boxShadow=\'0 0 6px rgba(0,212,255,0.2)\'" onblur="this.style.borderColor=\'var(--border)\';this.style.boxShadow=\'none\'">'+esc(data.content)+'</textarea>'+
        '<div style="display:flex;gap:0.4rem;margin-top:0.5rem;">'+
          '<button class="btn btn-success" onclick="saveSoul()">Save</button>'+
          '<button class="btn btn-secondary" onclick="showFiles(\''+esc(name)+'\')">Cancel</button>'+
        '</div>';
    });
}

function saveSoul() {
  var content = document.getElementById('soul-editor').value;
  fetch('/api/profiles/' + currentFileProfile + '/file?path=' + currentFilePath, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain'},
    body: content
  }).then(function(r){return r.json();}).then(function(data){
    if(data.error) { alert(data.error); return; }
    showToast('SOUL.md saved', 'success');
    showFiles(currentFileProfile);
  }).catch(function(){ showToast('Failed to save file', 'error'); });
}

function viewFile(filePath) {
  var container = document.getElementById('profiles-list');
  container.innerHTML = '<div style="color:var(--text-muted);font-size:0.65rem;padding:1rem;">Loading...</div>';
  currentFilePath = filePath;
  var fileName = filePath.split('/').pop();
  fetch('/api/profiles/' + currentFileProfile + '/file?path=' + encodeURIComponent(filePath))
    .then(function(r){return r.json();}).then(function(data){
      if(data.error) { container.innerHTML = '<div style="color:var(--accent-pink);font-size:0.65rem;padding:1rem;">Error: ' + esc(data.error) + '</div>'; return; }
      container.innerHTML =
        '<div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.75rem;">'+
          '<button class="btn" style="padding:0.25rem 0.5rem;font-size:0.6rem;" onclick="showFiles(\''+esc(currentFileProfile)+'\')">← Back</button>'+
          '<span style="font-size:0.7rem;color:var(--accent-cyan);font-weight:600;">📄 '+esc(fileName)+'</span>'+
          '<span style="font-size:0.55rem;color:var(--text-muted);">('+esc(currentFileProfile)+')</span>'+
        '</div>'+
        '<pre style="background:var(--bg-primary);border:1px solid var(--border);border-radius:3px;padding:0.75rem;font-size:0.65rem;color:var(--text-secondary);white-space:pre-wrap;word-wrap:break-word;max-height:calc(100vh - 200px);overflow-y:auto;font-family:inherit;">'+(data.content ? esc(data.content) : '(empty file)')+'</pre>';
    }).catch(function(){ container.innerHTML = '<div style="color:var(--accent-pink);font-size:0.65rem;padding:1rem;">Failed to load file</div>'; });
}

/* ── Create Profile ── */
var allPersonalities = [];

function loadPersonalities() {
  fetch('/api/identities').then(function(r){return r.json();}).then(function(data){
    allPersonalities = data;
  });
}

function showCreateProfile() {
  document.getElementById('create-profile-overlay').classList.add('active');
  document.getElementById('create-profile-name').value = '';
  document.getElementById('personality-preview').textContent = 'Select an identity template above...';
  document.getElementById('personality-skills').innerHTML = '<span style="color:var(--text-muted);font-size:0.6rem;">Select a personality to see skills...</span>';
  selectedIdentity = '';
  var list = document.getElementById('personality-list');
  list.innerHTML = '';
  // Blank option
  list.innerHTML += '<div class="personality-option" style="padding:0.4rem 0.6rem;border-radius:3px;cursor:pointer;margin-bottom:0.2rem;border:1px solid transparent;" data-identity="" onclick="selectPersonality(\'\',this)" onmouseover="this.style.background=\'var(--bg-tertiary)\'" onmouseout="this.style.background=\'transparent\'"><span style="color:var(--text-muted);font-size:0.65rem;">○</span> <span style="font-size:0.7rem;color:var(--text-primary);font-weight:600;">Blank</span> <span style="font-size:0.6rem;color:var(--text-muted);">— start from scratch</span></div>';
  for(var i=0;i<allPersonalities.length;i++){
    var p = allPersonalities[i];
    var preview = p.content ? p.content.replace(/[#*_\[\]()`~\n\r]/g,' ').substring(0,80).trim() + '...' : '';
    var displayName = p.name.charAt(0).toUpperCase() + p.name.slice(1);
    list.innerHTML += '<div class="personality-option" style="padding:0.4rem 0.6rem;border-radius:3px;cursor:pointer;margin-bottom:0.2rem;border:1px solid transparent;" data-identity="' + esc(p.name) + '" onclick="selectPersonality(\'' + esc(p.name) + '\',this)" onmouseover="this.style.background=\'var(--bg-tertiary)\'" onmouseout="this.style.background=\'transparent\'"><span style="color:var(--accent-cyan);font-size:0.65rem;">●</span> <span style="font-size:0.7rem;color:var(--text-primary);font-weight:600;">' + esc(displayName) + '</span> <span style="font-size:0.6rem;color:var(--text-muted);">— ' + esc(preview) + '</span></div>';
  }
  document.getElementById('create-profile-name').focus();
}

function hideCreateProfile() {
  document.getElementById('create-profile-overlay').classList.remove('active');
}

function selectPersonality(name, el) {
  var items = document.querySelectorAll('#personality-list > div');
  for(var i=0;i<items.length;i++){
    items[i].style.borderColor = 'transparent';
    items[i].style.background = 'transparent';
  }
  el.style.borderColor = 'var(--accent-cyan)';
  el.style.background = 'rgba(0,212,255,0.05)';
  selectedIdentity = name;
  // Find the personality data to show preview
  var personality = null;
  for(var i=0;i<allPersonalities.length;i++){
    if(allPersonalities[i].name === name) { personality = allPersonalities[i]; break; }
  }
  document.getElementById('personality-preview').textContent = personality ? personality.content : '(blank — no personality set)';
  // Fetch and display skills for this identity
  var skillsPreview = document.getElementById('personality-skills');
  if(!name) {
    skillsPreview.innerHTML = '<span style="color:var(--text-muted);font-size:0.6rem;">No skills installed for blank profile</span>';
    return;
  }
  skillsPreview.innerHTML = '<span style="color:var(--text-muted);font-size:0.6rem;">Loading skills...</span>';
  fetch('/api/identities/' + name + '/skills')
    .then(function(r){return r.json();}).then(function(data){
      var skills = data.skills || [];
      if(skills.length === 0) {
        skillsPreview.innerHTML = '<span style="color:var(--text-muted);font-size:0.6rem;">No additional skills</span>';
        return;
      }
      var html = '<div style="display:flex;flex-wrap:wrap;gap:0.3rem;margin-top:0.3rem;">';
      for(var i=0;i<skills.length;i++){
        html += '<span style="font-size:0.5rem;color:var(--accent-green);background:rgba(0,255,136,0.06);border:1px solid rgba(0,255,136,0.15);padding:0.1rem 0.3rem;border-radius:2px;">⬡ '+esc(skills[i])+'</span>';
      }
      html += '</div>';
      skillsPreview.innerHTML = html;
    }).catch(function(){
      skillsPreview.innerHTML = '<span style="color:var(--text-muted);font-size:0.6rem;">Could not load skills</span>';
    });
}

function submitCreateProfile() {
  var nameInput = document.getElementById('create-profile-name');
  var name = nameInput.value.trim().toLowerCase();
  if(!name) {
    nameInput.style.borderColor = 'var(--accent-pink)';
    nameInput.focus();
    showToast('Profile name is required', 'error');
    return;
  }
  // Validate name format
  if(!/^[a-z0-9][a-z0-9_-]{0,63}$/.test(name)) {
    nameInput.style.borderColor = 'var(--accent-pink)';
    nameInput.focus();
    showToast('Invalid name: lowercase alphanumerics, hyphens, underscores', 'error');
    return;
  }
  nameInput.style.borderColor = 'var(--border)';
  var body = {name: name};
  if(selectedIdentity) body.identity = selectedIdentity;
  fetch('/api/profiles', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  }).then(function(r){return r.json();}).then(function(data){
    if(data.error) { showToast(data.error, 'error'); return; }
    hideCreateProfile();
    showToast('Profile "' + name + '" created', 'success');
    loadProfiles();
    renderProfiles();
  }).catch(function(){ showToast('Failed to create profile', 'error'); });
}

/* ── Init ── */
loadProfiles();
loadPersonalities();
loadBoards();
loadTasks();
setInterval(loadTasks,10000);
</script>

    <button class="btn btn-success" onclick="showCreateProfile()">+ New Profile</button>
  </div>
  <div style="display:flex;gap:0.5rem;margin-bottom:1rem;align-items:center;">
    <input type="text" id="profile-search" placeholder="Filter profiles..." style="flex:1;padding:0.35rem 0.6rem;background:var(--bg-primary);border:1px solid var(--border);border-radius:2px;color:var(--text-primary);font-size:0.7rem;font-family:inherit;outline:none;" oninput="renderProfiles()" onfocus="this.style.borderColor='var(--accent-cyan)'" onblur="this.style.borderColor='var(--border)'" />
    <span id="profile-count" style="font-size:0.6rem;color:var(--text-muted);flex-shrink:0;"></span>
  </div>
  <div id="profiles-list" style="display:flex;flex-direction:column;gap:0.5rem;"></div>
</div>
</div><!-- end page-profiles -->

<!-- Create Profile Modal -->
<div class="modal-overlay" id="create-profile-overlay">
  <div class="modal" style="width:520px;">
    <h3>Create New Profile</h3>
    <div class="form-group">
      <label>Profile Name</label>
      <input type="text" id="create-profile-name" placeholder="e.g. researcher, coder" style="font-family:inherit;" />
    </div>
    <div class="form-group">
      <label>Personality Template</label>
      <div id="personality-list" style="max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:3px;padding:0.5rem;background:var(--bg-primary);"></div>
    </div>
    <div class="form-group">
      <label>Preview</label>
      <div id="personality-preview" style="font-size:0.65rem;color:var(--text-secondary);background:var(--bg-primary);border:1px solid var(--border);border-radius:3px;padding:0.5rem;min-height:40px;white-space:pre-wrap;"></div>
    </div>
    <div class="form-group">
      <label>Skills to Install</label>
      <div id="personality-skills" style="font-size:0.65rem;color:var(--text-secondary);background:var(--bg-primary);border:1px solid var(--border);border-radius:3px;padding:0.5rem;min-height:30px;"><span style="color:var(--text-muted);font-size:0.6rem;">Select a personality to see skills...</span></div>
    </div>
    <div class="form-actions">
      <button class="btn btn-success" onclick="submitCreateProfile()">Create</button>
      <button class="btn btn-secondary" onclick="hideCreateProfile()">Cancel</button>
    </div>
  </div>
</div>

</body>
</html>
